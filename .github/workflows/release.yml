name: Build and Release Digital Clock

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v3.0.0)"
        required: true
        default: "v3.0.0"

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev

      - name: Build digital clock
        run: |
          make clean
          make

      - name: Package Linux artifact
        run: |
          mkdir -p dist/linux
          cp digitalclock README.md LICENSE CHANGELOG.md dist/linux/
          tar -C dist/linux -czf dist/digitalclock-linux-${RELEASE_VERSION}.tar.gz .

      - name: Show dist contents (debug)
        run: ls -la dist || true

      - name: Check for Linux artifact
        run: test -f dist/digitalclock-linux-${RELEASE_VERSION}.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/digitalclock-linux-${{ env.RELEASE_VERSION }}.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make zip

      - name: Build digital clock
        shell: msys2 {0}
        run: |
          make clean
          make
          if [ ! -f digitalclock.exe ] && [ -f digitalclock ]; then
            mv digitalclock digitalclock.exe
          fi

      - name: Package Windows artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          zip -j "dist/digitalclock-windows-${RELEASE_VERSION}.zip" \
            digitalclock.exe README.md LICENSE CHANGELOG.md

      - name: Show dist contents (debug)
        shell: msys2 {0}
        run: ls -la dist || true

      - name: Check for Windows artifact
        shell: msys2 {0}
        run: test -f dist/digitalclock-windows-${RELEASE_VERSION}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/digitalclock-windows-${{ env.RELEASE_VERSION }}.zip

  release:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist/windows

      - name: Collect artifacts
        run: |
          mv dist/linux/* dist/
          mv dist/windows/* dist/

      - name: List all artifacts
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/digitalclock-linux-${{ env.RELEASE_VERSION }}.tar.gz
            dist/digitalclock-windows-${{ env.RELEASE_VERSION }}.zip
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Digital Clock ${{ env.RELEASE_VERSION }}
          body: |
            ## Digital Clock ${{ env.RELEASE_VERSION }}

            ### Downloads

            **Linux**
            - `digitalclock-linux-${{ env.RELEASE_VERSION }}.tar.gz` — includes the Nuklear GUI binary plus documentation

            **Windows**
            - `digitalclock-windows-${{ env.RELEASE_VERSION }}.zip` — ships the Win32 build and documentation

            ### Quick Start

            **Linux**
            ```bash
            tar -xzf digitalclock-linux-${{ env.RELEASE_VERSION }}.tar.gz
            chmod +x digitalclock
            ./digitalclock
            ```

            **Windows**
            ```powershell
            Expand-Archive digitalclock-windows-${{ env.RELEASE_VERSION }}.zip
            .\digitalclock.exe
            ```

            For detailed build notes, see README.md in each package.
          generate_release_notes: true
