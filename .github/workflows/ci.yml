name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev xvfb

      - name: Build Nuklear clock
        run: |
          make clean
          make

      - name: Smoke-test under Xvfb
        run: |
          set -euo pipefail
          xvfb-run -a bash -c '
            set -euo pipefail
            ./digitalclock >/tmp/dclock.log 2>&1 &
            pid=$!
            sleep 2
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "digitalclock exited unexpectedly"
              cat /tmp/dclock.log
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
            echo "GUI smoke test completed"
          '

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-logs
          path: /tmp/dclock.log
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make zip

      - name: Build Nuklear clock
        shell: msys2 {0}
        run: |
          make clean
          make
          if [ ! -f digitalclock.exe ] && [ -f digitalclock ]; then
            mv digitalclock digitalclock.exe
          fi

      - name: Smoke-test GUI launch
        shell: pwsh
        run: |
          Start-Process -FilePath digitalclock.exe -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $proc = Get-Process digitalclock -ErrorAction SilentlyContinue
          if (-not $proc) {
            throw "digitalclock.exe exited unexpectedly"
          }
          $proc | Stop-Process -Force

      - name: Package artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          zip -j dist/digitalclock-windows-ci.zip digitalclock.exe README.md LICENSE CHANGELOG.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-build
          path: dist/digitalclock-windows-ci.zip